<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>QBlock Search &amp; Add Friends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #17191d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app-wrap {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 24px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 12px;
      background: #ffffff;
    }
    .qb-squircle {
      border-radius: 14px;
      border: 1px solid rgba(23, 24, 27, 0.1);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(240, 243, 247, 0.94));
      box-shadow: 0 4px 12px rgba(23, 24, 27, 0.05), inset 1px 1px 0 rgba(255, 255, 255, 0.98);
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      cursor: pointer;
      text-decoration: none;
      color: #17191d;
    }
    .search-section {
      padding: 6px 20px 16px;
      display: flex;
      gap: 10px;
    }
    .search-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(23, 24, 27, 0.12);
      background: #f8fafc;
    }
    .search-input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      font-weight: 600;
      color: #17191d;
      width: 100%;
    }
    .search-btn {
      height: 44px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: #17191d;
    }
    .section-header {
      padding: 8px 20px 12px;
      font-size: 14px;
      font-weight: 800;
      color: #17191d;
      display: flex;
      justify-content: space-between;
    }
    .cards-grid {
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .user-card {
      border-radius: 18px;
      border: 1px solid rgba(23, 24, 27, 0.1);
      background: linear-gradient(180deg, #fbfcfd 0%, #f1f4f8 100%);
      box-shadow: 0 6px 16px rgba(23, 24, 27, 0.05);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .model-thumb {
      height: 140px;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #eef2f6;
      position: relative;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      outline: none;
    }
    .card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .user-name {
      font-size: 13.5px;
      font-weight: 800;
      color: #17191d;
    }
    .user-id {
      font-size: 11px;
      color: #697383;
      font-weight: 600;
    }
    .add-btn {
      height: 34px;
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(23, 24, 27, 0.1);
      background: #ffffff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #17191d;
      box-shadow: 0 2px 6px rgba(23, 24, 27, 0.04);
    }
    .card-spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.6);
    }
    .html-spinner {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.08);
      border-top-color: #fa4616;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <header class="top-bar">
      <a href="/" class="qb-squircle icon-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      </a>
      <div style="font-size: 17px; font-weight: 900; letter-spacing: -0.02em;">Search &amp; Add Friends</div>
      <a href="/chat" class="qb-squircle icon-btn" aria-label="Chats">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
      </a>
    </header>

    <div class="search-section">
      <div class="search-input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="color: #697383;">
          <path d="M21.71 20.29l-5.4-5.4A7.9 7.9 0 0018 10a8 8 0 10-8 8 7.9 7.9 0 004.89-1.69l5.4 5.4a1 1 0 001.42-1.42zM4 10a6 6 0 116 6 6 6 0 01-6-6z"/>
        </svg>
        <input type="text" class="search-input" placeholder="Enter ID / Nickname" />
      </div>
      <button class="qb-squircle search-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21.71 20.29l-5.4-5.4A7.9 7.9 0 0018 10a8 8 0 10-8 8 7.9 7.9 0 004.89-1.69l5.4 5.4a1 1 0 001.42-1.42zM4 10a6 6 0 116 6 6 6 0 01-6-6z"/>
        </svg>
        <span>Search</span>
      </button>
    </div>

    <div class="section-header">
      <span>Suggested Players</span>
      <span style="color: #697383; font-weight: 600;">4 Online</span>
    </div>

    <div class="cards-grid">
      <!-- Card 1 -->
      <div class="user-card">
        <div class="model-thumb">
          <model-viewer
            src="https://maxwell.z3ki.dev/bot/_files/char1-opt/char1_opt.gltf"
            alt="Player 1"
            camera-controls
            auto-rotate
            rotation-per-second="20deg"
            camera-orbit="0deg 75deg 3m"
            interaction-prompt="none"
            loading="lazy"
          ></model-viewer>
        </div>
        <div class="card-info">
          <div class="user-name">Alex_Block</div>
          <div class="user-id">ID: 948120</div>
        </div>
        <button class="add-btn" onclick="this.textContent='Requested ✓'">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          <span>Add</span>
        </button>
      </div>

      <!-- Card 2 -->
      <div class="user-card">
        <div class="model-thumb">
          <model-viewer
            src="https://maxwell.z3ki.dev/bot/_files/char2-opt/char2_opt.gltf"
            alt="Player 2"
            camera-controls
            auto-rotate
            rotation-per-second="20deg"
            camera-orbit="0deg 75deg 3m"
            interaction-prompt="none"
            loading="lazy"
          ></model-viewer>
        </div>
        <div class="card-info">
          <div class="user-name">CyberNova</div>
          <div class="user-id">ID: 830192</div>
        </div>
        <button class="add-btn" onclick="this.textContent='Requested ✓'">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          <span>Add</span>
        </button>
      </div>

      <!-- Card 3 -->
      <div class="user-card">
        <div class="model-thumb">
          <model-viewer
            src="https://maxwell.z3ki.dev/bot/_files/char1-opt/char1_opt.gltf"
            alt="Player 3"
            camera-controls
            auto-rotate
            rotation-per-second="20deg"
            camera-orbit="0deg 75deg 3m"
            interaction-prompt="none"
            loading="lazy"
          ></model-viewer>
        </div>
        <div class="card-info">
          <div class="user-name">VoxelKing</div>
          <div class="user-id">ID: 729104</div>
        </div>
        <button class="add-btn" onclick="this.textContent='Requested ✓'">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          <span>Add</span>
        </button>
      </div>

      <!-- Card 4 -->
      <div class="user-card">
        <div class="model-thumb">
          <model-viewer
            src="https://maxwell.z3ki.dev/bot/_files/char2-opt/char2_opt.gltf"
            alt="Player 4"
            camera-controls
            auto-rotate
            rotation-per-second="20deg"
            camera-orbit="0deg 75deg 3m"
            interaction-prompt="none"
            loading="lazy"
          ></model-viewer>
        </div>
        <div class="card-info">
          <div class="user-name">NeonRider</div>
          <div class="user-id">ID: 618302</div>
        </div>
        <button class="add-btn" onclick="this.textContent='Requested ✓'">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          <span>Add</span>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
